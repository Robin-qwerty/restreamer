# Restreamer with NVIDIA GPU encoding.
#
# Requirements on the host: NVIDIA driver and the NVIDIA Container Toolkit
# (see docs/vertical-setup.md). Start with: docker compose up -d
# The UI is then at http://<server>:8080/ui

services:
    restreamer:
        image: ghcr.io/robin-qwerty/restreamer:cuda-latest
        container_name: restreamer
        restart: unless-stopped
        ports:
            - '8080:8080' # HTTP (UI, API, HLS)
            - '8181:8181' # HTTPS
            - '1935:1935' # RTMP (OBS on the same host can use 127.0.0.1:1935)
            - '1936:1936' # RTMPS
            - '6000:6000/udp' # SRT
        volumes:
            - ./config:/core/config
            - ./data:/core/data
        environment:
            # The vertical channel reads the horizontal one from the internal RTMP server (low delay)
            CORE_RTMP_ENABLE: 'true'
            NVIDIA_VISIBLE_DEVICES: all
            NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
